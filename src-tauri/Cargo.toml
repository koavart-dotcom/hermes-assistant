[package]
name = "hermes"
version = "0.1.0"
description = "Hermes — personal AI assistant shell over Hermes Agent"
authors = ["Artem Kovalenko"]
edition = "2024"
rust-version = "1.85"

[lib]
name = "hermes_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = [] }
tauri-plugin-log = "2"
tauri-plugin-store = "2"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
ts-rs = { version = "12", features = ["serde-compat"] }

[profile.release]
codegen-units = 1
lto = true
opt-level = 3
panic = "abort"
strip = true

[dependencies.log]
version = "0.4"
