[package]
name = "hermes"
description = "Hermes — personal AI assistant shell over Hermes Agent"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
authors.workspace = true

[lib]
name = "hermes_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
hermes-core = { path = "../crates/hermes-core" }
tauri = { version = "2.12", features = ["devtools"] }
tauri-plugin-log = "2.10"
tauri-plugin-store = "2.5"
# No `zip` feature: every 2.x line of the plugin depends on zip ^4, which is
# fully yanked on crates.io; NSIS updates are plain .exe + .sig and need no zip.
tauri-plugin-updater = { version = "2.14", default-features = false, features = ["rustls-tls", "system-proxy"] }
tauri-plugin-process = "2.4"
serde.workspace = true
serde_json.workspace = true
ts-rs.workspace = true
tokio.workspace = true
tokio-util.workspace = true
log.workspace = true
base64 = "0.22"
