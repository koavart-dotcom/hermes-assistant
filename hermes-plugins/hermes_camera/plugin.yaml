name: hermes_camera
version: 0.1.0
description: >
  Hermes Assistant eyes: camera_snapshot grabs one frame from the PC
  webcam (DirectShow through the ffmpeg bundled with Hermes) and returns the
  file path for vision_analyze. Frames stay local (last 10 kept); HERMES_CAMERA=off
  disables the camera, HERMES_CAMERA_DEVICE picks a device by name.
  screen_snapshot captures the desktop or the active window (ffmpeg gdigrab).
provides_tools:
  - camera_snapshot
  - screen_snapshot
