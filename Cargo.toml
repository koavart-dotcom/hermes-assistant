[workspace]
resolver = "3"
members = ["crates/hermes-core", "src-tauri"]

[workspace.package]
version = "0.19.0"
edition = "2024"
rust-version = "1.85"
authors = ["Artem Kovalenko"]

[workspace.dependencies]
serde = { version = "1", features = ["derive"] }
serde_json = "1"
ts-rs = { version = "12", features = ["serde-compat"] }
tokio = { version = "1", features = ["rt-multi-thread", "process", "fs", "io-util", "macros", "sync", "time", "net"] }
tokio-util = "0.7"
thiserror = "2"
tracing = "0.1"
log = "0.4"

# Read the optimization guideline for more details: https://tauri.app/concept/size/#cargo-configuration
[profile.release]
codegen-units = 1
lto = true
opt-level = 3
panic = "abort"
strip = true
