name: Release

on:
  push:
    tags: ["v*"]

jobs:
  build:
    name: Build installers
    permissions:
      contents: write
    strategy:
      fail-fast: false
      matrix:
        include:
          - platform: windows-latest
            args: ""
    runs-on: ${{ matrix.platform }}
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
      - run: pnpm install --frozen-lockfile
      # Vosk engine for the fast wake word / quick commands: shipped in the installer so the
      # app never downloads executable code (Defender ML flagged that as a dropper).
      - name: Bundle Vosk engine
        shell: pwsh
        run: |
          $zip = "$env:RUNNER_TEMP\vosk.zip"
          Invoke-WebRequest https://github.com/alphacep/vosk-api/releases/download/v0.3.45/vosk-win64-0.3.45.zip -OutFile $zip
          $sha = (Get-FileHash $zip -Algorithm SHA256).Hash.ToLower()
          if ($sha -ne "f1dcc9cca460630f81ea8f71794f69c80bed6556d2a4e6237b5785e1d2dff34b") { throw "vosk zip checksum mismatch: $sha" }
          Expand-Archive $zip "$env:RUNNER_TEMP\vosk"
          Copy-Item "$env:RUNNER_TEMP\vosk\vosk-win64-0.3.45\*.dll" src-tauri/resources/vosk/
          Get-ChildItem src-tauri/resources/vosk
      # Server mode (docs/SERVER.md): hermesd.exe ships inside the same installer; the
      # NSIS hook offers to register it as a Windows service.
      - name: Build hermesd (server mode)
        shell: pwsh
        run: |
          cargo build --release -p hermesd
          Copy-Item target/release/hermesd.exe src-tauri/resources/server/
          Get-ChildItem src-tauri/resources/server
      - uses: tauri-apps/tauri-action@v0
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          # Updater signature (tauri signer generate); the app verifies it with
          # plugins.updater.pubkey in tauri.conf.json.
          TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
          TAURI_SIGNING_PRIVATE_KEY_PASSWORD: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY_PASSWORD }}
        with:
          tagName: ${{ github.ref_name }}
          releaseName: "Hermes Assistant ${{ github.ref_name }}"
          releaseBody: "Сборка из тега ${{ github.ref_name }}. Установщик Windows: .exe (NSIS) или .msi; установленное приложение обновится само."
          # Published right away: the in-app updater reads latest.json from the
          # latest release (drafts are invisible to it).
          releaseDraft: false
          prerelease: false
          includeUpdaterJson: true
          args: ${{ matrix.args }}
      # Server self-update (docs/SERVER.md): hermesd + resources as one signed zip and a
      # manifest; the service reads releases/latest/download/hermesd.json.
      - name: Server update package
        shell: pwsh
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
          TAURI_SIGNING_PRIVATE_KEY_PASSWORD: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY_PASSWORD }}
        run: |
          $tag = "${{ github.ref_name }}"
          $ver = $tag.TrimStart('v')
          $pkg = "$env:RUNNER_TEMP\hermesd-pkg"
          $res = "$pkg\resources"
          New-Item -ItemType Directory -Force $res | Out-Null
          Copy-Item target/release/hermesd.exe $pkg/
          Copy-Item -Recurse src-tauri/resources/hermes "$res/hermes"
          foreach ($p in 'hermes_permissions', 'hermes_camera') {
            New-Item -ItemType Directory -Force "$res/hermes-plugins/$p" | Out-Null
            Copy-Item "hermes-plugins/$p/plugin.yaml", "hermes-plugins/$p/__init__.py" "$res/hermes-plugins/$p/"
          }
          Copy-Item -Recurse hermes-skills "$res/hermes-skills"
          New-Item -ItemType Directory -Force "$res/hermes-persona", "$res/hermes-quick-commands" | Out-Null
          Copy-Item hermes-persona/SOUL.md "$res/hermes-persona/"
          Copy-Item hermes-quick-commands/default.ru.json "$res/hermes-quick-commands/"
          Copy-Item -Recurse dist-server "$res/server-ui"
          $zip = "hermesd-windows-x64.zip"
          Compress-Archive -Path "$pkg\*" -DestinationPath $zip -Force
          pnpm tauri signer sign $zip
          $sig = (Get-Content "$zip.sig" -Raw).Trim()
          $url = "https://github.com/${{ github.repository }}/releases/download/$tag/$zip"
          @{ version = $ver; zip = $url; signature = $sig; notes = "Hermes Assistant Server $tag" } | ConvertTo-Json | Set-Content -Encoding utf8NoBOM hermesd.json
          Get-Content hermesd.json
          gh release upload $tag $zip hermesd.json --clobber

  server-macos:
    # Hermes Assistant Server on a Mac (launchd daemon, docs/SERVER.md): hermesd + resources
    # as a signed zip and a manifest; the daemon reads hermesd-macos-arm64.json.
    name: Server package (macOS arm64)
    needs: build
    permissions:
      contents: write
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
      - run: pnpm install --frozen-lockfile
      - run: pnpm exec vite build -c vite.server.config.ts
      - run: cargo build --release -p hermesd
      - name: Package, sign, upload
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
          TAURI_SIGNING_PRIVATE_KEY_PASSWORD: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY_PASSWORD }}
        run: |
          set -euo pipefail
          tag="${{ github.ref_name }}"
          pkg="$RUNNER_TEMP/hermesd-pkg"
          res="$pkg/resources"
          mkdir -p "$res/hermes-persona" "$res/hermes-quick-commands"
          cp target/release/hermesd "$pkg/"
          cp -R src-tauri/resources/hermes "$res/hermes"
          for p in hermes_permissions hermes_camera; do
            mkdir -p "$res/hermes-plugins/$p"
            cp "hermes-plugins/$p/plugin.yaml" "hermes-plugins/$p/__init__.py" "$res/hermes-plugins/$p/"
          done
          cp -R hermes-skills "$res/hermes-skills"
          cp hermes-persona/SOUL.md "$res/hermes-persona/"
          cp hermes-quick-commands/default.ru.json "$res/hermes-quick-commands/"
          cp -R dist-server "$res/server-ui"
          zip="hermesd-macos-arm64.zip"
          (cd "$pkg" && zip -qr "$GITHUB_WORKSPACE/$zip" .)
          pnpm tauri signer sign "$zip"
          url="https://github.com/${{ github.repository }}/releases/download/$tag/$zip"
          jq -n --arg v "${tag#v}" --arg z "$url" --rawfile s "$zip.sig" --arg n "Hermes Assistant Server $tag (macOS)" \
            '{version: $v, zip: $z, signature: ($s | rtrimstr("\n")), notes: $n}' > hermesd-macos-arm64.json
          cat hermesd-macos-arm64.json
          gh release upload "$tag" "$zip" hermesd-macos-arm64.json --clobber
